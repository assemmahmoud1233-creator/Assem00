name: Build Shadow Sword
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o "ef_shadow_sword_mod.zip" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: |
          cd "$(dirname "$(find proj -name build.gradle | head -1)")"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowSword-jar
          path: proj/**/build/libs/*.jar
